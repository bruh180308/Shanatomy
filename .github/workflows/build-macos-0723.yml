name: Build Shanatomy Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-macos-0723.yml"]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and unpack
        run: |
          python - <<'PY'
          import hashlib,pathlib,stat,zipfile
          p=pathlib.Path('Shanatomy-MacOS-Source_0.7.22.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='801d8b58dc037f46a0802417806d29517e149275ded35bf63f434f7f6ae75395'
          with zipfile.ZipFile(p) as z:
              seen=set()
              for item in z.infolist():
                  name=pathlib.PurePosixPath(item.filename)
                  assert not name.is_absolute() and '..' not in name.parts and '\\' not in item.filename
                  assert item.filename not in seen;seen.add(item.filename)
                  assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)
              assert sum(i.file_size for i in z.infolist())<300*1024*1024
              z.extractall('build-input')
          import shutil,json
          import gzip,base64
          payload=json.loads(gzip.decompress(base64.b64decode('')))
          overlay=pathlib.Path('mac-ui-0.7.23')
          for rel,content in payload.items():
              p=overlay/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content.encode('utf8'))
          for rel,sha in json.loads((overlay/'overlay-sha256.json').read_text()).items():
              src=overlay/rel
              assert hashlib.sha256(src.read_bytes()).hexdigest()==sha
              dst=pathlib.Path('build-input/Shanatomy-MacOS')/rel
              dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
          boot=pathlib.Path('build-input/Shanatomy-MacOS/Shanatomy Mac.app/Contents/Resources/assets/bootstrap.template.js')
          data=boot.read_bytes();assert data.count(b'"version":"0.7.22"')==1
          data=data.replace(b'"version":"0.7.22"',b'"version":"0.7.23"')
          assert hashlib.sha256(data).hexdigest()=='216aa7f1a1a8fe526a4c2bd2ae37465cebc65cd15a0da9fca2b0d941a0adbe4c'
          boot.write_bytes(data)
          PY
      - name: Install build dependencies
        run: |
          python -m pip install --only-binary=:all: --no-binary=:none: 'pyinstaller==6.22.3' 'cryptography==50.0.1'
          python -c 'import tkinter,platform; assert platform.machine()=="arm64"; print(tkinter.Tcl().eval("info patchlevel"))'
      - name: Test Mac logic on macOS
        run: |
          RES="$PWD/build-input/Shanatomy-MacOS/Shanatomy Mac.app/Contents/Resources"
          cp build-input/Shanatomy-MacOS/BUILD_TESTS/test_*.py "$RES/"
          mkdir -p artifacts
          # macOS /var is an OS symlink. Give fixtures a physical temp path;
          # keep production refusal of user-created symlinks unchanged.
          export TMPDIR="$(python -c 'import tempfile,pathlib; print(pathlib.Path(tempfile.gettempdir()).resolve())')"
          (cd "$RES"; python -m unittest discover -p 'test_*.py' -v) > artifacts/mac-python-tests.log 2>&1
      - name: Build self-contained application
        run: |
          RES="$PWD/build-input/Shanatomy-MacOS/Shanatomy Mac.app/Contents/Resources"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --target-arch arm64 --hidden-import platform --name ShanatomyMac --osx-bundle-identifier vn.hungle.shanatomy.mac --icon "$RES/icon.icns" --add-data "$RES/assets:assets" --distpath native-dist --workpath native-work --specpath native-work "$RES/cavi_mac.py"
          mv native-dist/ShanatomyMac.app 'native-dist/Shanatomy Mac.app'
          python "$RES/package_native.py" --app 'native-dist/Shanatomy Mac.app' --out artifacts/Shanatomy-MacOS.zip --version 0.7.23
          codesign --verify --deep --strict --verbose=2 'native-dist/Shanatomy Mac.app'
          file 'native-dist/Shanatomy Mac.app/Contents/MacOS/ShanatomyMac' > artifacts/binary.txt
      - name: Verify packaged executable and ZIP
        run: |
          RES="$PWD/build-input/Shanatomy-MacOS/Shanatomy Mac.app/Contents/Resources"
          'native-dist/Shanatomy Mac.app/Contents/MacOS/ShanatomyMac' --self-test --self-test-report "$PWD/artifacts/mac-self-test.json"
          'native-dist/Shanatomy Mac.app/Contents/MacOS/ShanatomyMac' --ui-self-test "$PWD/artifacts/mac-ui-self-test.json"
          python - <<'PY'
          import json
          p=json.load(open('artifacts/mac-self-test.json'))
          assert p['frozen'] and p['architecture']=='arm64' and p['assets_verified']
          assert not p['app_opened'] and not p['cache_changed']
          PY
          PYTHONPATH="$RES" python - <<'PY'
          import tempfile,pathlib,shutil,json
          from mac_updater import extract_app,validate_bundle,bundle_kind
          temp=pathlib.Path(tempfile.mkdtemp()).resolve()
          try:
              app=extract_app(pathlib.Path('artifacts/Shanatomy-MacOS.zip').resolve(),temp/'verify.app')
              import subprocess
              subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(app)],check=True)
              assert bundle_kind(app)=='self-contained-app'
              print('Actual ZIP updater extraction, codesign and manifest: PASS')
              pathlib.Path('artifacts/zip-update-test.json').write_text(json.dumps({'passed':True,'version':'0.7.23'}))
          finally:shutil.rmtree(temp)
          PY
          shasum -a 256 artifacts/*.zip > artifacts/SHA256SUMS.txt
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shanatomy-MacOS-Native-0.7.23
          path: artifacts/
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shanatomy-MacOS-Build-Diagnostics
          path: artifacts/
          if-no-files-found: ignore
